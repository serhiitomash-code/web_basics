<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя перша HTML-форма</title>
</head>
<body>
<h1>Моя перша HTML-форма</h1>

<form action="https://httpbin.org/get" method="get">
  <p>
    <label for="name">Ім'я:</label>
    <input type="text" id="name" name="user_name">
  </p>

  <p>
    <label for="bdate">Дата народження:</label>
    <input type="date" id="bdate" name="user_birthdate">
  </p>

  <p>
    <label>Імейл:
      <input type="email" name="user_email">
    </label>
  </p>

  <p>
    <label for="msg">Повідомлення:</label>
    <textarea id="msg" name="user_message"></textarea>
  </p>

  <p>Ваші улюблені напої?</p>
  <p>
    <label><input type="checkbox" name="drinks" value="coffee"> Кава</label><br>
    <label><input type="checkbox" name="drinks" value="tea"> Чай</label><br>
    <label><input type="checkbox" name="drinks" value="juice"> Сік</label><br>
    <label><input type="checkbox" name="drinks" value="water"> Вода</label>
  </p>

  <p>Моя національність</p>
  <p>
    <label><input type="radio" name="nationality" value="ukrainian"> Українець / Українка</label><br>
    <label><input type="radio" name="nationality" value="polish"> Поляк / Полька</label><br>
    <label><input type="radio" name="nationality" value="other"> Інша</label>
  </p>

  <button type="submit">Надіслати</button>
  <button type="reset">Очистити</button>
</form>

 <picture>
    <source media="(max-width: 467px)" srcset="https://picsum.photos/300/500">
    <img src="https://picsum.photos/1000/400" alt="Тестове зображення">
  </picture>
</body>
</html>
